name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build addon
        run: pnpm build

      - name: Build local Storybook
        run: pnpm build-storybook

      - name: Check package contents
        run: npm pack --dry-run

  compatibility:
    name: Storybook ${{ matrix.storybook-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storybook-version:
          - 9.1.20
          - 10.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Storybook ${{ matrix.storybook-version }} integration
        run: pnpm test:browser -- ${{ matrix.storybook-version }}

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.storybook-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
